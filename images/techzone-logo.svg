  <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Tech<tspan fill="#38bdf8">Zone</tspan></text>
