  <line x1="31" y1="30" x2="36" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="11" x2="20" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="11" x2="25" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
